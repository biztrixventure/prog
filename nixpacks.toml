# Nixpacks build for Coolify.
#
# Progressive blocks HEADLESS Chrome, and a VPS has no screen — so we run Chrome
# HEADFUL inside Xvfb (a virtual display). requirements.txt makes Nixpacks set up
# Python + pip; the phase below adds Xvfb and the Chromium browser, then we start
# the app under `xvfb-run`.
#
# IMPORTANT: install xvfb with APT, not as a Nix package. The Nix name differs
# (xorg.xvfb) and putting "xvfb"/"fonts-liberation" in the Nix setup broke the
# nix-env step (exit 255). Chromium's own fonts/libs come from --with-deps.

[phases.browsers]
dependsOn = ["install"]
cmds = [
  "apt-get update && apt-get install -y --no-install-recommends xvfb && rm -rf /var/lib/apt/lists/*",
  "python -m playwright install --with-deps chromium",
]

# Start Xvfb in the BACKGROUND (with an explicit x24 depth or it errors
# "Invalid screen configuration") and exec Python as the container's main
# process. This is more reliable than `xvfb-run`, which in this container left
# Xvfb running but the Python process dead -> the app 502'd with no logs.
# Python binds the port even if Xvfb hiccups; DISPLAY=:99 lets Chrome draw.
[start]
cmd = "sh -c 'Xvfb :99 -screen 0 1280x1024x24 & export DISPLAY=:99 && exec python dashboard.py'"
