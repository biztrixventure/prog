# Nixpacks build for Coolify.
#
# The tricky part of this app: Progressive blocks HEADLESS Chrome, and a VPS has
# no screen. So we run Chrome in HEADFUL mode inside Xvfb (a virtual screen that
# lives in RAM). That means:
#   * install xvfb (the virtual display),
#   * install Chromium WITH its system deps (playwright --with-deps),
#   * start the app under `xvfb-run` so headful Chrome has somewhere to draw.
#
# requirements.txt makes Nixpacks auto-detect Python and pip-install it; the
# phases below add what Playwright + Xvfb need on top.

[phases.setup]
aptPkgs = ["xvfb", "fonts-liberation", "ca-certificates"]

[phases.browsers]
# Runs after the pip install phase; downloads Chromium and apt-installs the
# shared libraries it needs. --with-deps is what stops the "missing .so" crashes.
dependsOn = ["install"]
cmds = ["python -m playwright install --with-deps chromium"]

[start]
cmd = "xvfb-run -a python dashboard.py"
